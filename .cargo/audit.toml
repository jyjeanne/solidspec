# Cargo Audit Configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/config/struct.AuditConfig.html

[advisories]
# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (informational, no CVE, no
# patched release — the repo is archived). Pulled in by serde_yaml 0.9, which
# both solidspec and the pinned okf-rs crates (okf-core/-parser/-validator/
# -generator) depend on, so swapping serde_yaml here alone would not remove it.
# Drop this once solidspec and okf-rs move to a maintained YAML crate.
ignore = ["RUSTSEC-2024-0449"]

[output]
quiet = false
deny = ["warnings"]
