schema_version: "1.0"
extension:
  id: okf
  name: "OKF Knowledge Graph"
  version: "0.1.0"
  description: "Scaffolds an okf.toml so this project can generate an Open Knowledge Format (okf-rs) knowledge-graph bundle for AI agents to query instead of re-reading files cold."
  author: "SolidSpec"
  tags:
    - knowledge-graph
    - okf-rs
    - context
requires:
  solidspec_version: ">=0.3.0"
  tools:
    - name: okf-rs
      required: false
provides:
  commands:
    - name: solidspec.okf.init
      file: hooks/after-init.sh
      description: "Scaffold okf.toml for the OKF knowledge-graph bundle (fired automatically after `solidspec init`)"
hooks:
  after_init:
    command: solidspec.okf.init
    optional: true
