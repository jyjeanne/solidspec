[package]
name = "solidspec"
version = "0.3.1"
edition = "2024"
description = "AI-powered multi-methodology development CLI — SDD, TDD, IDSD, APEX, and more"
license = "MIT"
repository = "https://github.com/jyjeanne/solidspec"
homepage = "https://github.com/jyjeanne/solidspec"
documentation = "https://github.com/jyjeanne/solidspec#readme"
readme = "README.md"
keywords = ["sdd", "spec-driven", "ai-agent", "cli", "tdd"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
semver = "1"

# Templates
tera = "2"

# Git integration
git2 = "0.21"

# Regex
regex = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Terminal UI
console = "0.16"

# CLI detection
which = "8"

# Time
chrono = "0.4"

# Knowledge graph (docs/okf-rs-integration-plan.md step 2): vendored as
# library crates rather than shelling out to a separately-installed
# `okf-rs` binary. Pinned to a tagged release, not a branch, so the
# resolved commit only moves when this Cargo.toml is deliberately bumped.
okf-core = { git = "https://github.com/jyjeanne/okf-rs", tag = "v0.7.0" }
okf-analyzer = { git = "https://github.com/jyjeanne/okf-rs", tag = "v0.7.0" }
okf-generator = { git = "https://github.com/jyjeanne/okf-rs", tag = "v0.7.0" }
okf-validator = { git = "https://github.com/jyjeanne/okf-rs", tag = "v0.7.0" }
okf-parser = { git = "https://github.com/jyjeanne/okf-rs", tag = "v0.7.0" }

[lints.rust]
future-incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }

[lints.clippy]
redundant_clone = { level = "deny", priority = 9 }
needless_collect = "warn"
large_enum_variant = "warn"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
